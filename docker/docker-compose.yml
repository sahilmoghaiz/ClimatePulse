
services:
  kafka:
    image: apache/kafka:4.0.1
    container_name: climatepulse-kafka

    ports:
      - "9092:9092"
      - "9094:9094"

    networks:
      - airflow_network

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,K8S://:9094,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://climatepulse-kafka:29092,K8S://host.docker.internal:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,K8S:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

networks:
  airflow_network:
    external: true
    name: airflow_default
