apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: climatepulse-airflow:k8s
          imagePullPolicy: Never
          args: ["standalone"]
          ports:
            - containerPort: 8080
          env:
            - name: AIRFLOW_HOME
              value: /opt/airflow

            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: /opt/airflow/dags

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"

            - name: KAFKA_BROKER
              value: "host.docker.internal:9094"

            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /home/airflow/.aws/credentials

            - name: AWS_CONFIG_FILE
              value: /home/airflow/.aws/config

          volumeMounts:
            - name: aws-profile
              mountPath: /home/airflow/.aws
              readOnly: true

      volumes:
        - name: aws-profile
          secret:
            secretName: aws-profile